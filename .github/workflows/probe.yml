# Temporary: finds which Swift installer features CI can leave out. Removed
# before merge.
name: Probe installer options

on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: ${{ matrix.runner }} ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
        name: [none, dbg-py, ide, android, x86, other-arch, all-but-ide]
        include:
          - runner: windows-2025
            installer: amd64
            other-arch: OptionsInstallWindowsSDKARM64=0 OptionsInstallWindowsRedistARM64=0
          - runner: windows-11-arm
            installer: arm64
            other-arch: OptionsInstallWindowsSDKAMD64=0 OptionsInstallWindowsRedistAMD64=0
          - name: none
            options: ''
          - name: dbg-py
            options: OptionsInstallDBG=0 OptionsInstallPy=0
          - name: ide
            options: OptionsInstallIDE=0
          - name: android
            options: OptionsInstallAndroidPlatform=0
          - name: x86
            options: OptionsInstallWindowsSDKX86=0 OptionsInstallWindowsRedistX86=0
          - name: other-arch
            options: OTHER
          - name: all-but-ide
            options: OptionsInstallDBG=0 OptionsInstallPy=0 OptionsInstallAndroidPlatform=0 OptionsInstallWindowsSDKX86=0 OptionsInstallWindowsRedistX86=0 OTHER
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Options
        id: options
        env:
          OPTIONS: ${{ matrix.options }}
          OTHER: ${{ matrix.other-arch }}
        run: echo "args=${OPTIONS/OTHER/$OTHER}" >> "$GITHUB_OUTPUT"
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
          build_arch: ${{ matrix.installer }}
          installer-args: ${{ steps.options.outputs.args }}
      - name: Size
        shell: pwsh
        run: |
          $Root = Join-Path $env:LOCALAPPDATA 'Programs\Swift'
          Get-ChildItem $Root -Directory | ForEach-Object {
            $Size = (Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum
            "{0,-12} {1,8:N0} MB" -f $_.Name, ($Size / 1MB)
          }
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: .github/scripts/swift-test.sh --skip-build
