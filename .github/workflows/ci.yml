# Builds the library and runs its tests on every tier 1 and tier 2 platform in
# docs/validation.md (Platforms), as rule 4 of the definition of done requires.
# Each platform is its own job, so each reports as its own status check.
#
# Every job builds and tests in Debug, then builds in Release, where the
# optimizer inlines the hot paths and the shim's builtins. macOS and Linux also
# test the Release build; Windows can't yet (see the windows job).
# `-enable-testing` lets the Release build serve the tests' `@testable import`.
# Every job then runs one benchmark with BenchmarkRunner.
#
# Tests run through .github/scripts/swift-test.sh, which fails a run that
# discovers no tests instead of letting it pass.
#
# Every job restores SwiftPM's build folders from a cache (see the macos job),
# and the Windows jobs restore the installed toolchain.

name: CI

on:
  # Pull requests cover branch work; pushes to main check each merge.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new commit on a pull request supersedes the last one, so a pull request
  # shares one group and cancels. Every other run gets a group of its own:
  # a shared group keeps only one pending run, so a burst of merges would drop
  # the middle main commit's result.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # The same shell everywhere, so the test script runs unchanged. On Windows
    # this is Git Bash.
    shell: bash

jobs:
  macos:
    name: macOS arm64
    # GitHub names macOS images after their Xcode. The xcode-27 image runs
    # macOS 27 and ships Swift 6.4, which Package.swift requires.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Also names the compiler and the runner image for the build cache: the
      # cached modules were built by this compiler from this image's SDK.
      - name: Toolchain
        id: toolchain
        run: |
          swift --version
          echo "id=$({ swift --version; echo "${ImageVersion:-}"; } 2>&1 | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # SwiftPM's build folders, so a build reuses the modules it compiled from
      # the SDK and the toolchain, and a Debug build the objects of sources
      # that haven't changed. Keyed on the job, the toolchain step's id, and
      # the manifests, the sources and this workflow, which sets the build
      # flags; any earlier cache with the same job and id is the fallback.
      - name: Restore build folders
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            Benchmarks/.build
          key: build-macos-arm64-${{ steps.toolchain.outputs.id }}-${{ hashFiles('.github/workflows/ci.yml', 'Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**', 'Benchmarks/**') }}
          restore-keys: build-macos-arm64-${{ steps.toolchain.outputs.id }}-
      # The checkout gives every source a new modification time, which alone
      # would make an incremental build compile them all again. With file
      # hashing, the compiler skips a source only when its contents match the
      # cached build's. Release builds compile each module whole, so they
      # always compile every source.
      - name: Build
        run: swift build --build-tests -Xswiftc -enable-incremental-file-hashing
      - name: Test
        run: .github/scripts/swift-test.sh --skip-build -Xswiftc -enable-incremental-file-hashing
      - name: Build release
        run: swift build -c release --build-tests -Xswiftc -enable-testing
      - name: Test release
        run: .github/scripts/swift-test.sh -c release --skip-build -Xswiftc -enable-testing
      # BenchmarkRunner, built as benchmarks are measured. One short benchmark
      # checks that the runner builds and runs here and that its allocation
      # counter passes its self-check. CI's virtual machines don't expose
      # instruction counts, so the runner reports none; the figures are
      # measured by hand.
      - name: Benchmarks
        run: swift run -c release --package-path Benchmarks BenchmarkRunner --filter 'Vector3\.dot'
      # Saved under the key the restore step computed, before the build folders
      # existed to change the sources' hash. A run that restored its exact key
      # has nothing new to save.
      - name: Save build folders
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            Benchmarks/.build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # At the default x86-64 baseline, without FMA: the shim's fused
          # multiply-adds fall back to libm's fmaf, and the tests still expect
          # the same bits as everywhere else. The benchmarks build at
          # x86-64-v3, as x86-64 benchmarks are measured (docs/validation.md,
          # x86-64 instruction set).
          - arch: x86-64
            runner: ubuntu-24.04
            benchmark-level: -Xcc -march=x86-64-v3
          - arch: arm64
            runner: ubuntu-24.04-arm
            benchmark-level: ''
    runs-on: ${{ matrix.runner }}
    # The official multi-architecture image; the tag is for reading, the digest
    # is what runs.
    container: swift:6.4.1-noble@sha256:64f2c54113c2d5c234ed8fa2f59684b5d1ab3c4802657031679b4a8d6308a2dd
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # As on macOS.
      - name: Toolchain
        id: toolchain
        run: |
          swift --version
          echo "id=$({ swift --version; echo "${ImageVersion:-}"; } 2>&1 | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # As on macOS.
      - name: Restore build folders
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            Benchmarks/.build
          key: build-linux-${{ matrix.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('.github/workflows/ci.yml', 'Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**', 'Benchmarks/**') }}
          restore-keys: build-linux-${{ matrix.arch }}-${{ steps.toolchain.outputs.id }}-
      # As on macOS.
      - name: Build
        run: swift build --build-tests -Xswiftc -enable-incremental-file-hashing
      - name: Test
        run: .github/scripts/swift-test.sh --skip-build -Xswiftc -enable-incremental-file-hashing
      - name: Build release
        run: swift build -c release --build-tests -Xswiftc -enable-testing
      - name: Test release
        run: .github/scripts/swift-test.sh -c release --skip-build -Xswiftc -enable-testing
      # As on macOS.
      - name: Benchmarks
        run: swift run -c release --package-path Benchmarks ${{ matrix.benchmark-level }} BenchmarkRunner --filter 'Vector3\.dot'
      # As on macOS.
      - name: Save build folders
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            Benchmarks/.build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # At the default x86-64 baseline, as on Linux: no SSE4.1 and no FMA,
          # so the shim takes its portable paths and its fused multiply-adds
          # call the Microsoft C runtime's fmaf. Tier 1 is measured at
          # x86-64-v3, which CI builds for the benchmarks only (see
          # docs/validation.md, Platforms).
          - arch: x86-64
            runner: windows-2025
            installer: amd64
            other-sdk: OptionsInstallWindowsSDKARM64=0 OptionsInstallWindowsRedistARM64=0
            benchmark-level: -Xcc -march=x86-64-v3
          - arch: arm64
            runner: windows-11-arm
            installer: arm64
            other-sdk: OptionsInstallWindowsSDKAMD64=0 OptionsInstallWindowsRedistAMD64=0
            benchmark-level: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      # The swift.org toolchain. Linux runs the official image of the same
      # version, and macOS the Swift that ships with its Xcode.
      SWIFT_VERSION: 6.4.1
      # The installer's features that CI doesn't use: the debugger and its
      # Python, the Android SDKs, and the Windows SDKs for other architectures
      # (with the matrix's other-sdk). Leaving them out shrinks the install by
      # about a third, and so the cached toolchain. The editor tools stay:
      # swift-build loads libraries from their package.
      SWIFT_INSTALLER_OPTIONS: OptionsInstallDBG=0 OptionsInstallPy=0 OptionsInstallAndroidPlatform=0 OptionsInstallWindowsSDKX86=0 OptionsInstallWindowsRedistX86=0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The installer, not the download, is the slow part of the setup. So the
      # cache holds the installed toolchain, and the environment variables the
      # installer set for it, keyed on the version, the architecture and the
      # installer's options.
      - name: Restore toolchain
        id: swift-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/AppData/Local/Programs/Swift
            ~/AppData/Local/Programs/Swift.env
            ~/AppData/Local/Programs/Swift.path
          key: swift-${{ env.SWIFT_VERSION }}-windows-${{ matrix.installer }} ${{ env.SWIFT_INSTALLER_OPTIONS }} ${{ matrix.other-sdk }}
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        if: steps.swift-cache.outputs.cache-hit != 'true'
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-release
          swift-build: ${{ env.SWIFT_VERSION }}-RELEASE
          build_arch: ${{ matrix.installer }}
          installer-args: ${{ env.SWIFT_INSTALLER_OPTIONS }} ${{ matrix.other-sdk }}
      # The installer sets the toolchain's variables and search paths for the
      # user. Record those that point into the toolchain, so a run that
      # restores it can set them again.
      - name: Record toolchain environment
        if: steps.swift-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $Root = Join-Path $env:LOCALAPPDATA 'Programs\Swift'
          $User = [Environment]::GetEnvironmentVariables('User')
          $User.GetEnumerator() |
            Where-Object { $_.Name -ne 'Path' -and $_.Value -like "*$Root*" } |
            ForEach-Object { "$($_.Name)=$($_.Value)" } |
            Set-Content "$Root.env"
          $User['Path'] -split ';' | Where-Object { $_ -like "$Root*" } | Set-Content "$Root.path"
          if (-not (Get-Content "$Root.path")) {
            Write-Host "::error::The installer added no search path under $Root"
            exit 1
          }
          Get-Content "$Root.env", "$Root.path"
      - name: Use restored toolchain
        if: steps.swift-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $Root = Join-Path $env:LOCALAPPDATA 'Programs\Swift'
          Get-Content "$Root.env" | Add-Content $env:GITHUB_ENV
          # Each line of GITHUB_PATH goes in front of the last, so add the
          # paths in reverse to keep the installer's order.
          $Paths = @(Get-Content "$Root.path")
          [Array]::Reverse($Paths)
          $Paths | Add-Content $env:GITHUB_PATH
      # As on macOS.
      - name: Toolchain
        id: toolchain
        run: |
          swift --version
          echo "id=$({ swift --version; echo "${ImageVersion:-}"; } 2>&1 | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # As on macOS.
      - name: Restore build folders
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            Benchmarks/.build
          key: build-windows-${{ matrix.arch }}-${{ steps.toolchain.outputs.id }}-${{ hashFiles('.github/workflows/ci.yml', 'Package.swift', 'Package.resolved', 'Sources/**', 'Tests/**', 'Benchmarks/**') }}
          restore-keys: build-windows-${{ matrix.arch }}-${{ steps.toolchain.outputs.id }}-
      # As on macOS.
      - name: Build
        run: swift build --build-tests -Xswiftc -enable-incremental-file-hashing
      - name: Test
        run: .github/scripts/swift-test.sh --skip-build -Xswiftc -enable-incremental-file-hashing
      # Build only: Swift Testing finds no tests in Windows Release builds, so a
      # test step would pass while testing nothing. See KNOWN_ISSUES.md and #32.
      - name: Build release
        run: swift build -c release --build-tests -Xswiftc -enable-testing
      # As on macOS. On x86-64 this also checks that the build passes the
      # runner's x86-64-v3 level check.
      - name: Benchmarks
        run: swift run -c release --package-path Benchmarks ${{ matrix.benchmark-level }} BenchmarkRunner --filter 'Vector3\.dot'
      # Saved only after every step above passed, so an install that can't
      # build and test the package never reaches the cache.
      - name: Save toolchain
        if: steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/AppData/Local/Programs/Swift
            ~/AppData/Local/Programs/Swift.env
            ~/AppData/Local/Programs/Swift.path
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}
      # As on macOS.
      - name: Save build folders
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            Benchmarks/.build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
